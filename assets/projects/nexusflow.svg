<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_nexu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow_nexu" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="600" height="380" rx="16" fill="#0f111a" stroke="#232738" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect width="600" height="42" rx="16" fill="#161926"/>
  <rect y="20" width="600" height="22" fill="#161926"/>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#232738" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="25" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="43" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="61" cy="21" r="5.5" fill="#10b981"/>
  
  <!-- Window Address Bar -->
  <rect x="90" y="11" width="300" height="20" rx="6" fill="#0d0e17"/>
  <text x="105" y="25" fill="#64748b" font-size="10" font-family="'Courier New', monospace">https://app.nexusflow.io/dashboard</text>

  <!-- Tag badge -->
  <rect x="420" y="11" width="160" height="20" rx="6" fill="url(#grad_nexu)" opacity="0.2"/>
  <text x="500" y="25" fill="#8b5cf6" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">AI WORKSPACE & LLM PIPELINE</text>

  <!-- Dashboard Sidebar -->
  <rect x="20" y="60" width="120" height="300" rx="10" fill="#141724" stroke="#202436" stroke-width="1"/>
  <rect x="35" y="75" width="90" height="14" rx="4" fill="url(#grad_nexu)" opacity="0.8"/>
  
  <rect x="35" y="110" width="70" height="8" rx="3" fill="#334155"/>
  <rect x="35" y="130" width="80" height="8" rx="3" fill="#334155"/>
  <rect x="35" y="150" width="60" height="8" rx="3" fill="#334155"/>
  <rect x="35" y="170" width="75" height="8" rx="3" fill="#334155"/>
  <rect x="35" y="190" width="65" height="8" rx="3" fill="#334155"/>

  <!-- Main Canvas / Graph / Charts -->
  <!-- Top Stat Cards -->
  <g transform="translate(155, 60)">
    <rect width="130" height="65" rx="10" fill="#141724" stroke="#202436" stroke-width="1"/>
    <text x="15" y="25" fill="#94a3b8" font-size="10" font-family="sans-serif">99.4% Latency SLA</text>
    <text x="15" y="48" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold">ACTIVE</text>
    <circle cx="110" cy="32" r="8" fill="#8b5cf6" opacity="0.3"/>
  </g>
  <g transform="translate(295, 60)">
    <rect width="130" height="65" rx="10" fill="#141724" stroke="#202436" stroke-width="1"/>
    <text x="15" y="25" fill="#94a3b8" font-size="10" font-family="sans-serif">4.2M Tokens/Day</text>
    <text x="15" y="48" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold">99.98%</text>
    <circle cx="110" cy="32" r="8" fill="#ec4899" opacity="0.3"/>
  </g>
  <g transform="translate(435, 60)">
    <rect width="145" height="65" rx="10" fill="#141724" stroke="#202436" stroke-width="1"/>
    <text x="15" y="25" fill="#94a3b8" font-size="10" font-family="sans-serif">Autonomous RAG</text>
    <text x="15" y="48" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold">ONLINE</text>
    <circle cx="125" cy="32" r="8" fill="#10b981" opacity="0.3"/>
  </g>

  <!-- Big Interactive Chart Panel -->
  <g transform="translate(155, 140)">
    <rect width="425" height="220" rx="12" fill="#141724" stroke="#202436" stroke-width="1"/>
    
    <!-- Title inside chart -->
    <text x="20" y="28" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="bold">NexusFlow AI Platform</text>
    <text x="20" y="45" fill="#64748b" font-size="11" font-family="sans-serif">Live system telemetry and distributed state</text>

    <!-- Grid lines -->
    <line x1="20" y1="90" x2="405" y2="90" stroke="#1e293b" stroke-width="1"/>
    <line x1="20" y1="130" x2="405" y2="130" stroke="#1e293b" stroke-width="1"/>
    <line x1="20" y1="170" x2="405" y2="170" stroke="#1e293b" stroke-width="1"/>

    <!-- Wave Area / Chart Line -->
    <path d="M25 180 Q80 130 140 150 T240 100 T330 120 T400 70 L400 200 L25 200 Z" fill="url(#grad_nexu)" opacity="0.25"/>
    <path d="M25 180 Q80 130 140 150 T240 100 T330 120 T400 70" fill="none" stroke="url(#grad_nexu)" stroke-width="3.5" filter="url(#glow_nexu)"/>
    
    <!-- Data points -->
    <circle cx="140" cy="150" r="4.5" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="240" cy="100" r="4.5" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="330" cy="120" r="4.5" fill="#ffffff" stroke="#ec4899" stroke-width="2"/>
    <circle cx="400" cy="70" r="5" fill="#ffffff" stroke="#ec4899" stroke-width="2.5"/>
  </g>
</svg>