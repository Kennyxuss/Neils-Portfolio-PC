<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_cbcs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>
    <filter id="glow_cbcs" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="850" height="580" rx="18" fill="url(#bgGrad_cbcs)"/>
  
  <!-- Outer Filigree Gold/Accent Border -->
  <rect x="22" y="22" width="806" height="536" rx="14" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.6"/>
  <rect x="32" y="32" width="786" height="516" rx="10" fill="none" stroke="#252a3d" stroke-width="1.5"/>

  <!-- Ornate Corner Accents -->
  <path d="M38 70 L38 38 L70 38" fill="none" stroke="#06b6d4" stroke-width="3.5"/>
  <path d="M812 70 L812 38 L780 38" fill="none" stroke="#06b6d4" stroke-width="3.5"/>
  <path d="M38 510 L38 542 L70 542" fill="none" stroke="#06b6d4" stroke-width="3.5"/>
  <path d="M812 510 L812 542 L780 542" fill="none" stroke="#06b6d4" stroke-width="3.5"/>

  <!-- Official Top Institution Seal -->
  <circle cx="425" cy="85" r="38" fill="#181d2e" stroke="#06b6d4" stroke-width="2.5" filter="url(#glow_cbcs)"/>
  <circle cx="425" cy="85" r="30" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 3"/>
