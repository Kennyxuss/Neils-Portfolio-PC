  <line x1="90" y1="495" x2="270" y2="495" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="485" fill="#06b6d4" font-size="16" font-family="'Brush Script MT', cursive" text-anchor="middle">Teacher Sarah Jane</text>
  <text x="180" y="515" fill="#64748b" font-size="11" font-family="sans-serif" text-anchor="middle">Head Teacher</text>

  <!-- Center Verified Stamp -->
  <g transform="translate(385, 460)">
    <circle cx="40" cy="40" r="32" fill="#141724" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="40" cy="40" r="26" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="40" y="37" fill="#06b6d4" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">OFFICIAL</text>
    <text x="40" y="49" fill="#10b981" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">VERIFIED</text>
  </g>

