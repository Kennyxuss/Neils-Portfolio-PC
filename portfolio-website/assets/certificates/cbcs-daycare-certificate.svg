  <text x="425" y="170" fill="#94a3b8" font-size="11" font-family="sans-serif" letter-spacing="1.5" text-anchor="middle">EARLY CHILDHOOD EDUCATION & CARE CENTER</text>

  <!-- Certificate Heading -->
  <text x="425" y="210" fill="#f8fafc" font-size="26" font-family="'Times New Roman', serif" font-weight="bold" letter-spacing="1" text-anchor="middle">CERTIFICATE OF COMPLETION</text>
  <line x1="280" y1="225" x2="570" y2="225" stroke="#06b6d4" stroke-width="2" opacity="0.8"/>

  <!-- Certification Body -->
  <text x="425" y="258" fill="#94a3b8" font-size="13" font-family="sans-serif" text-anchor="middle">Awarded in recognition of having completed the early developmental curriculum in</text>
  <text x="425" y="296" fill="#ffffff" font-size="22" font-family="'Outfit', sans-serif" font-weight="bold" text-anchor="middle">Day-Care Center Edition School</text>
  
  <!-- Honors & Year Badge -->
  <g transform="translate(325, 318)">
    <rect width="200" height="30" rx="15" fill="#06b6d4" opacity="0.15"/>
    <rect width="200" height="30" rx="15" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="100" y="20" fill="#06b6d4" font-size="11" font-family="sans-serif" font-weight="bold" letter-spacing="1" text-anchor="middle">GRADUATED • EXCELLENCE</text>
  </g>

  <!-- Academic Year -->
  <text x="425" y="375" fill="#cdd6f4" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="middle">School Year: 2010 - 2011</text>

