  <line x1="580" y1="495" x2="760" y2="495" stroke="#334155" stroke-width="1.5"/>
  <text x="670" y="485" fill="#06b6d4" font-size="16" font-family="'Brush Script MT', cursive" text-anchor="middle">Pastor D. Gabriel</text>
  <text x="670" y="515" fill="#64748b" font-size="11" font-family="sans-serif" text-anchor="middle">Director</text>
  <text x="670" y="535" fill="#64748b" font-size="9.5" font-family="monospace" text-anchor="middle">DOC ID: CBCS-DAYCARE-2011-1055</text>
</svg>