  <text x="425" y="410" fill="#94a3b8" font-size="11.5" font-family="sans-serif" text-anchor="middle">
    <tspan x="425" dy="0">Successfully completed all early foundational learning levels with distinct</tspan>
    <tspan x="425" dy="18">ion, good citizenship, and exemplary early cognitive milestones.</tspan>
  </text>

